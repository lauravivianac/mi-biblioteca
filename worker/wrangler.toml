name = "mi-biblioteca-agente"
main = "index.js"
compatibility_date = "2025-01-01"

# La app llama al Worker por su dirección .workers.dev, así que esta va a true.
workers_dev = true

# Y las URLs de vista previa, a false. Cloudflare las activa por su cuenta y
# dejan cada versión antigua del Worker accesible en su propia dirección: si
# algún día hay que arreglar un guardrail, la versión con el fallo seguiría
# ahí, contestando. Ninguna es necesaria — la app usa una sola dirección.
preview_urls = false

[vars]
# Desde qué dominios puede llamarse al Worker.
#
# El `*` cubre UN tramo del dominio y está ahí por Vercel, que inventa
# una URL nueva por cada rama: sin comodín habría que volver aquí cada
# vez que se abre un PR, y eso acaba siempre en poner `*` a secas.
#
# `https://mi-biblioteca-*.vercel.app` NO deja entrar a
# `otra-cosa.vercel.app` ni a `mi-biblioteca-x.vercel.app.evil.com`;
# hay pruebas de eso en scripts/test-worker.mjs.
ALLOWED_ORIGINS = "https://lauravivianac.github.io,https://mi-biblioteca.vercel.app,https://mi-biblioteca-*.vercel.app,http://localhost:8080"

# La key de DeepSeek NO va aquí: este archivo está en el repositorio.
# Va como secreto del entorno, con `wrangler secret put DEEPSEEK_API_KEY`.
