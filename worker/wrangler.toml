name = "mi-biblioteca-agente"
main = "index.js"
compatibility_date = "2025-01-01"

# La app llama al Worker por su dirección .workers.dev, así que esta va a true.
workers_dev = true

# Y las URLs de vista previa, a false. Cloudflare las activa por su cuenta y
# dejan cada versión antigua del Worker accesible en su propia dirección: si
# algún día hay que arreglar un guardrail, la versión con el fallo seguiría
# ahí, contestando. Ninguna es necesaria — la app usa una sola dirección.
preview_urls = false

# ── DÓNDE SE LLEVAN LAS CUENTAS ──────────────────────────────────────
# Va comentado a propósito: con un id inventado, `wrangler deploy` falla
# y te quedas sin agente. Sin KV el Worker funciona igual, pero los
# contadores viven en memoria y se pierden cuando Cloudflare recicla el
# isolate — o sea, el techo mensual no frena de verdad.
#
# Para activarlo, dos pasos:
#   1) npx wrangler kv namespace create AGENTE
#   2) descomenta las tres líneas de abajo y pega el id que imprimió
#
# [[kv_namespaces]]
# binding = "AGENTE"
# id = "aqui-el-id-que-te-dio-wrangler"

# ── EL RELOJ DE LOS AVISOS  ·  historias #69 y #95 ───────────────────
# Cada hora en punto. No cada minuto: el recordatorio tiene media hora de
# margen (ver MARGEN_MINUTOS en src/habito-core.js), así que una vuelta
# por hora basta y son 24 ejecuciones al día en vez de 1440.
#
# La hora es UTC. Quien lee en Bogotá está en UTC-5, y por eso cada
# suscripción guarda su franja horaria: el cron mira quién tiene su hora
# AHORA, no manda a todo el mundo a la vez.
[triggers]
crons = ["0 * * * *"]

[vars]

# El contacto de VAPID. La norma lo exige y los servicios de push lo
# comprueban: sin un mailto: válido, FCM contesta 403 sin explicar por
# qué. Va aquí y no como secreto porque es una dirección pública.
VAPID_CONTACTO = "mailto:soporte@mibiblioteca.app"

# Y la pública, la misma que está en src/push.js. El Worker la necesita
# para armar la cabecera de VAPID (el `k=`).
VAPID_PUBLICA = "BCMCk19F16wf7bLNniqoXoOZyCI8XdOQNRuIxPxBFmePdL5b2R3Et0eBbaR5IP7S1sV28ifVIPi0ADl2DUra0p8"

# Desde qué dominios puede llamarse al Worker.
#
# El `*` cubre UN tramo del dominio y está ahí por Vercel, que inventa
# una URL nueva por cada rama: sin comodín habría que volver aquí cada
# vez que se abre un PR, y eso acaba siempre en poner `*` a secas.
#
# `https://mi-biblioteca-*.vercel.app` NO deja entrar a
# `otra-cosa.vercel.app` ni a `mi-biblioteca-x.vercel.app.evil.com`;
# hay pruebas de eso en scripts/test-worker.mjs.
ALLOWED_ORIGINS = "https://lauravivianac.github.io,https://mi-biblioteca.vercel.app,https://mi-biblioteca-*.vercel.app,http://localhost:8080"

# NI LA DE DEEPSEEK NI LA PRIVADA DE VAPID van aquí: este archivo está en
# el repositorio. Las dos van como secretos del entorno:
#
#   npx wrangler secret put DEEPSEEK_API_KEY
#   npx wrangler secret put VAPID_PRIVADA

# Techo de gasto para TODA la app, en dólares al mes. Cuando se pasa,
# el agente deja de responder hasta el mes siguiente y la app lo dice
# con claridad. Súbelo cuando sepas cuánto se gasta de verdad.
MONTHLY_BUDGET_USD = "2"

# Precios de deepseek-chat, en dólares por millón de tokens.
# COMPRUÉBALOS de vez en cuando: si cambian y esto no, el techo deja
# de ser el que crees.
PRICE_IN_PER_M = "0.27"
PRICE_OUT_PER_M = "1.10"
