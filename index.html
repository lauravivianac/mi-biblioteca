<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0D0A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<meta name="description" content="Plan lector y tracker de libros">
<link rel="manifest" href="./manifest.webmanifest">

<title>Mi Biblioteca ✨</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/app.css">
<link rel="stylesheet" href="./styles/ui.css">

<script>
/* Pinta el tema guardado ANTES del primer pintado.
   Sin esto la app aparece medio segundo con el tema equivocado. */
(function () {
  try {
    var snap = JSON.parse(localStorage.getItem('bib_theme_snap') || 'null');
    if (!snap) return;
    var root = document.documentElement;
    for (var k in snap) if (snap[k]) root.style.setProperty(k, snap[k]);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta && snap['--void']) meta.setAttribute('content', snap['--void']);
    var ls = document.getElementById('loading-screen');
  } catch (e) {}
})();
</script>
</head>

<body>

<div id="loading-screen">
  <div class="load-rune">✦</div>
  <div class="load-text">Cargando biblioteca...</div>
  <div class="load-bar"><div class="load-bar-fill"></div></div>
</div>

<div class="bg-canvas" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="deco-lines"></div>
</div>

<!-- ACCESO -->
<div class="fullscreen" id="auth-screen"></div>

<!-- ONBOARDING -->
<div class="fullscreen" id="onboard-screen"></div>

<div class="app-wrapper">
  <header class="app-header">
    <div class="header-inner">
      <div class="header-top">
        <div class="brand">
          <div class="brand-title">✦ Mi Biblioteca</div>
          <div class="brand-sub">Plan lector</div>
        </div>
        <div class="header-actions">
          <div class="header-gems">
            <div class="gem">
              <div class="gem-num" id="stat-total">0</div>
              <div class="gem-label">libros</div>
            </div>
            <div class="gem">
              <div class="gem-num" id="stat-read">0</div>
              <div class="gem-label">leídos</div>
            </div>
          </div>
          <button class="icon-btn" onclick="openThemeStore()" aria-label="Tienda de temas" title="Tienda de temas">🎨</button>
          <button class="icon-btn" onclick="openSettings()" aria-label="Ajustes" title="Ajustes">⚙</button>
        </div>
      </div>
    </div>
    <div id="save-state"></div>
    <nav class="nav-bar">
      <div class="nav-item active" onclick="nav('plan',this)" role="button" tabindex="0">
        <span class="nav-icon">🗓</span><span class="nav-label">Plan</span>
      </div>
      <div class="nav-item" onclick="nav('biblioteca',this)" role="button" tabindex="0">
        <span class="nav-icon">📚</span><span class="nav-label">Biblioteca</span>
      </div>
      <div class="nav-item" onclick="nav('tracker',this)" role="button" tabindex="0">
        <span class="nav-icon">✨</span><span class="nav-label">Tracker</span>
      </div>
    </nav>
  </header>

  <div class="scroll-area">
    <!-- PLAN -->
    <div class="view active" id="view-plan">
      <div style="height:4px"></div>
      <div class="year-row">
        <div class="year-btn active" onclick="setYear(2026,this)">2026</div>
        <div class="year-btn" onclick="setYear(2027,this)">2027</div>
        <div class="year-btn" onclick="setYear(2028,this)">2028</div>
      </div>
      <button class="btn-ghost full" onclick="openPlanner()" style="margin-bottom:14px">
        ✦ Armar mi plan según mi tiempo
      </button>
      <div id="plan-body"></div>
    </div>

    <!-- BIBLIOTECA -->
    <div class="view" id="view-biblioteca">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Buscar título o autor..." oninput="searchLib(this.value)" aria-label="Buscar">
      </div>
      <div class="filter-scroll" id="genre-chips"></div>
      <div class="filter-scroll" id="status-chips"></div>
      <div id="lib-body"></div>
    </div>

    <!-- TRACKER -->
    <div class="view" id="view-tracker">
      <div class="tracker-orb-card">
        <svg width="0" height="0" aria-hidden="true">
          <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:var(--gold)"/>
              <stop offset="100%" style="stop-color:var(--amber)"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="orb-ring-wrap">
          <svg class="orb-ring" width="110" height="110" viewBox="0 0 110 110">
            <circle class="orb-ring-bg" cx="55" cy="55" r="46"/>
            <circle class="orb-ring-fill" id="ring-fill" cx="55" cy="55" r="46"
              stroke-dasharray="289.0" stroke-dashoffset="289.0"/>
          </svg>
          <div class="orb-center">
            <div class="orb-pct" id="ring-pct">0%</div>
            <div class="orb-sublabel">avance</div>
          </div>
        </div>
        <div class="tracker-stats">
          <div class="tstat"><div class="tstat-num" id="t-read">0</div><div class="tstat-label">leídos</div></div>
          <div class="tstat"><div class="tstat-num" id="t-reading">0</div><div class="tstat-label">leyendo</div></div>
          <div class="tstat"><div class="tstat-num" id="t-pending">0</div><div class="tstat-label">pendientes</div></div>
        </div>
      </div>
      <div class="section-heading"><span class="section-heading-text">Registra tu progreso</span></div>
      <div id="tracker-body"></div>
    </div>
  </div>
</div>

<button class="fab" onclick="openAdd()" aria-label="Agregar libro">＋</button>

<!-- AGREGAR LIBRO -->
<div class="overlay" id="add-overlay" onclick="closeAdd(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">✦ Agregar libro</div>
    <div class="fg"><label class="flabel" for="f-title">Título</label><input class="finput" id="f-title" placeholder="Título del libro"></div>
    <div class="fg"><label class="flabel" for="f-author">Autor</label><input class="finput" id="f-author" placeholder="Nombre del autor"></div>
    <div class="fg"><label class="flabel" for="f-genre">Género</label><select class="fselect" id="f-genre"></select></div>
    <div class="frow">
      <div class="fg"><label class="flabel" for="f-year">Año</label>
        <select class="fselect" id="f-year">
          <option value="2026">2026</option><option value="2027">2027</option>
          <option value="2028">2028</option><option value="">Sin asignar</option>
        </select>
      </div>
      <div class="fg"><label class="flabel" for="f-month">Mes</label><select class="fselect" id="f-month"><option value="">—</option></select></div>
    </div>
    <div class="frow">
      <div class="fg"><label class="flabel" for="f-pages">Páginas</label><input class="finput" id="f-pages" placeholder="~300"></div>
      <div class="fg"><label class="flabel" for="f-role">Rol</label>
        <select class="fselect" id="f-role"><option value="⚓ Ancla">⚓ Ancla</option><option value="⚡ Corto">⚡ Corto</option></select>
      </div>
    </div>
    <button class="btn-magic" onclick="submitAddBook()">✦ Agregar a mi biblioteca</button>
  </div>
</div>

<!-- DETALLE -->
<div class="overlay" id="detail-overlay" onclick="closeDetail(event)">
  <div class="sheet" id="detail-sheet" style="padding-top:0"></div>
</div>

<!-- TIENDA DE TEMAS -->
<div class="overlay" id="store-overlay" onclick="closeStore(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">🎨 Tienda</div>
    <div id="store-body"></div>
  </div>
</div>

<!-- AJUSTES -->
<div class="overlay" id="settings-overlay" onclick="closeSettings(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">⚙ Ajustes</div>
    <div id="settings-body"></div>
  </div>
</div>

<!-- ASISTENTE DEL PLAN -->
<div class="overlay" id="planner-overlay" onclick="closePlanner(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="planner-body"></div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
